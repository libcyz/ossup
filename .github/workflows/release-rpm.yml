name: Build Fedora RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Bump this to ship a newer ossutil with the RPM.
  OSSUTIL_VERSION: "2.4.0"

jobs:
  build-rpm:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            build-essential \
            curl wget file unzip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch ossutil (Linux amd64) and bundle it
        run: |
          mkdir -p src-tauri/binaries
          curl -fsSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil
          install -m 0755 \
            "/tmp/ossutil/ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" \
            src-tauri/binaries/ossutil
          src-tauri/binaries/ossutil version || true

      - name: Build RPM
        run: npm run tauri build -- --bundles rpm

      - name: Collect RPM
        id: collect
        run: |
          mkdir -p dist-rpm
          cp src-tauri/target/release/bundle/rpm/*.rpm dist-rpm/
          ls -lh dist-rpm/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ossup-rpm-x86_64
          path: dist-rpm/*.rpm
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-rpm/*.rpm
          fail_on_unmatched_files: true
