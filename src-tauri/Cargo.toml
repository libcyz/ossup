[package]
name = "ossup"
version = "0.1.0"
description = "OSS 上传助手 - ossutil GUI"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ossup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "net", "rt-multi-thread", "macros", "time", "sync"] }
regex = "1"
base64 = "0.22"
walkdir = "2"
tauri-plugin-opener = "2.5.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
